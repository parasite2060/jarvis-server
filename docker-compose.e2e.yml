# E2E Test Infrastructure
# Usage: docker compose -f docker-compose.e2e.yml up -d --wait
# Note: Uses different ports from local development to allow running simultaneously

name: service-template-e2e-test

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: test123
      POSTGRES_DB: e2e_test_db
    ports:
      - 5433:5432 # E2E: 5433, Local: 5432
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
      - ./test/setup/postgres-init.sql:/docker-entrypoint-initdb.d/01-jarvis-schema.sql:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d e2e_test_db']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - 6380:6379 # E2E: 6380, Local: 6379
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  temporal:
    image: temporalio/temporal:1.7.0
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --namespace
      - default
      - --log-level
      - warn
    ports:
      - 7234:7233 # gRPC frontend (E2E: 7234, Local dev compose: 7233)
      - 8234:8233 # Web UI (E2E: 8234, Local dev compose: 8233)
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'namespace', 'describe', 'default', '--address', 'localhost:7233']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  api-mock:
    build:
      context: ../api-mock-server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "11435:11435"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:11435/health | grep -q ok || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_e2e_data: